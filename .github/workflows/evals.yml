name: evals
# Paid: runs the agent 20 scenarios x 3 runs x 2 arms. Manual only.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: runs per scenario per arm
        default: "3"
      model:
        description: model id (empty = CLI default)
        default: ""
permissions:
  contents: read
jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: make build && make evals-dry
      - name: run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HOSTOPS_EVAL_MODEL: ${{ inputs.model }}
        run: python3 evals/graders/run_evals.py --runs "${{ inputs.runs }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-results
          path: |
            evals/RESULTS.md
            evals/results/
