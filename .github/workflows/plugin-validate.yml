name: plugin-validate
on:
  push:
    branches: [main]
    paths: ["plugin/**", ".claude-plugin/**", "scripts/check-skills.sh", ".github/workflows/plugin-validate.yml"]
  pull_request:
    paths: ["plugin/**", ".claude-plugin/**", "scripts/check-skills.sh", ".github/workflows/plugin-validate.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: skill contract (<500 lines, write reach => disable-model-invocation, naming, Rationalizations)
        run: bash scripts/check-skills.sh plugin
      - name: claude plugin validate --strict
        run: |
          claude plugin validate --strict plugin/.claude-plugin/plugin.json
          claude plugin validate --strict plugin
          claude plugin validate --strict plugin/skills
          claude plugin validate --strict plugin/agents
          claude plugin validate --strict .
