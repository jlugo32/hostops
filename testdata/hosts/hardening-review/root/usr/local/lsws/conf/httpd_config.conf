#
# PLAIN TEXT CONFIGURATION FILE (anonymised from a CyberPanel host)
#
serverName                srv0000000.example-hosting.net
user                      nobody
group                     nobody

virtualHost Example{
    vhRoot                   Example/
    allowSymbolLink          1
    enableScript             1
    restrained               1
}

listener Default{
  address                 *:80
  secure                  0
  map                     example.com example.com
  map                     shop.example.net shop.example.net
  map                     blog.example.org blog.example.org
}

listener SSL {
  address                 *:443
  secure                  1
  keyFile                  /usr/local/lsws/admin/conf/webadmin.key
  certFile                 /usr/local/lsws/admin/conf/webadmin.crt
  map                     example.com example.com
  map                     shop.example.net shop.example.net
  map                     blog.example.org blog.example.org
}

virtualHost example.com {
  vhRoot                  /home/$VH_NAME
  configFile              $SERVER_ROOT/conf/vhosts/$VH_NAME/vhost.conf
  allowSymbolLink         1
  enableScript            1
  restrained              1
}

virtualHost shop.example.net {
  vhRoot                  /home/$VH_NAME
  configFile              $SERVER_ROOT/conf/vhosts/$VH_NAME/vhost.conf
  allowSymbolLink         1
  enableScript            1
  restrained              1
}

virtualHost blog.example.org {
  vhRoot                  /home/$VH_NAME
  configFile              $SERVER_ROOT/conf/vhosts/$VH_NAME/vhost.conf
  allowSymbolLink         1
  enableScript            1
  restrained              1
}
